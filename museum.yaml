# museum's settings that are the same on every server. Everything else (the domain, the
# bucket, the mailbox, the keys) is in .env: compose hands it to museum as ENTE_* variables,
# which win over this file. Every setting museum has, with what it does:
# https://github.com/ente/ente/blob/main/server/configurations/local.yaml

db:
  # The postgres service in compose.yaml. The password: ENTE_DB_PASSWORD.
  host: postgres
  port: 5432
  name: ente_db
  user: pguser

s3:
  # false: an external bucket over HTTPS (true is for a local MinIO without SSL).
  are_local_buckets: false
  # Path style (endpoint/bucket/...) is Ente's default; Backblaze and Hetzner both take it.
  use_path_style_urls: true
  # The bucket itself ("b2-eu-cen") comes entirely from .env: ENTE_S3_B2_EU_CEN_*.
